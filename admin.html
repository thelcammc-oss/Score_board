<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | VIBRANZA</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><strong>VIBRANZA 2026</strong><span>Admin Panel</span></div><nav><a href="index.html">View Dashboard</a><button class="btn small" type="button" onclick="adminLogout()">Logout</button></nav></header>
<main class="container"><div class="page-heading"><div><p class="eyebrow">POINTS MANAGEMENT</p><h1>Admin Panel</h1><p class="muted">Add, edit, delete and export competition results.</p></div></div>
<section class="panel"><h2 id="formTitle">Add Result</h2><form id="resultForm" class="form-grid"><input type="hidden" id="resultId"><div><label for="event">Event Name *</label><input id="event" required placeholder="e.g. Western Solo Dance"></div><div><label for="house">House *</label><select id="house" required><option value="">Select house</option><option>Yellow House</option><option>Blue House</option><option>Red House</option><option>Green House</option></select></div><div><label for="participant">Participant Name *</label><input id="participant" required></div><div><label for="regNo">Register Number</label><input id="regNo"></div><div><label for="rank">Rank *</label><select id="rank" required><option value="">Select rank</option><option>1st Place</option><option>2nd Place</option><option>3rd Place</option><option>Participation</option><option>Special Award</option></select></div><div><label for="points">Points *</label><input id="points" type="number" min="0" step="1" required></div><div><label for="date">Date</label><input id="date" type="date"></div><div><label for="remarks">Remarks</label><input id="remarks" placeholder="Optional"></div><div class="form-actions"><button class="btn primary" type="submit">Save Result</button><button class="btn secondary" type="button" id="cancelEdit">Clear Form</button></div></form></section>
<section class="panel"><div class="section-heading"><h2>Saved Results</h2><button class="btn secondary" id="exportCsv" type="button">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Event</th><th>House</th><th>Participant</th><th>Reg. No.</th><th>Rank</th><th>Points</th><th>Actions</th></tr></thead><tbody id="adminRows"></tbody></table></div><p id="emptyAdmin" class="muted"></p></section></main><footer>Admin access · VIBRANZA 2026</footer><script src="auth.js"></script><script src="script.js"></script></body></html>
